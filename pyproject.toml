[project]
name = "pi-minecraft-server"
version = "2.0.0"
description = "Discord control and idle shutdown for a Raspberry Pi Minecraft server"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiohttp>=3.9,<4", "discord.py>=2.5,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minecraft_manager"]
